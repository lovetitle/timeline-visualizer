<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>隱私報告 · 時間軸視覺化</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="eyebrow"><a id="i18n-back" href="./">← 回到工具</a></p>
        <h1 id="i18n-heading">隱私報告</h1>
        <p id="i18n-lede" class="lede">時間軸 JSON 不會上傳。此頁只顯示本機記錄的地圖圖磚請求摘要，可隨時清除。</p>
      </header>
      <section class="panel">
        <h2 id="i18n-tiles">本機圖磚請求</h2>
        <p id="privacy-summary" class="status">讀取中…</p>
        <div class="actions">
          <button id="privacy-clear-button" class="secondary" type="button"><span id="i18n-clear">清除本機記錄</span></button>
          <a id="i18n-start" class="button" href="./">開始使用</a>
        </div>
        <h2 id="i18n-principles">原則</h2>
        <ul id="i18n-principles-items" class="faq-list"></ul>
      </section>
    </div>
    <script type="module">
      import { applyStaticPage } from '/src/staticPages.ts';
      import { clearTileLog, summarizeTileLog } from '/src/privacyReport.ts';
      applyStaticPage('privacy');
      const locale = localStorage.getItem('tv-locale') || 'zh';
      const summary = document.getElementById('privacy-summary');
      const clearBtn = document.getElementById('privacy-clear-button');
      if (summary) summary.textContent = summarizeTileLog(locale);
      clearBtn?.addEventListener('click', () => {
        clearTileLog();
        if (summary) summary.textContent = summarizeTileLog(locale);
      });
    </script>
  </body>
</html>
