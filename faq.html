  <body>
    <div class="page">
      <header class="hero">
        <p class="eyebrow"><a href="./">← 回到工具</a></p>
        <h1>常見問題</h1>
      </header>
      <section class="panel">
        <h2>怎麼匯出檔案？</h2>
        <p>Google 地圖 → 頭像 → 設定 → 位置和隱私 → 匯出檔案。不要用電腦版地圖，也不要用舊 Takeout。</p>
        <h2>時間軸是空的？</h2>
        <p>到「你的時間軸」用雲端備份匯入後，再重新匯出。若從未開備份，舊資料通常無法救回。</p>
        <h2>為什麼不能 Google 登入抓資料？</h2>
        <p>時間軸改為裝置端儲存，官方沒有給第三方讀取的 API。</p>
        <h2>無法產出 MP4？</h2>
        <p>請用 Chrome、Edge 或 Safari 16.4 以上，並保持分頁開啟。</p>
        <h2>自訂網域？</h2>
        <p>在 Vercel 專案 Settings → Domains 綁定你的網域即可。</p>
        <p><a class="button secondary" href="./updates.html">更新公告</a> <a class="button" href="./">回到工具</a></p>
      </section>
    </div>
